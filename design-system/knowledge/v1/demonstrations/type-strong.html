<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One offer line</title>
<style>
  :root { color-scheme: light; --ink:#1c1915; --paper:#f6f1e8; --line:#d9d0c3; --accent:#8c3a2f; }
  body { margin:0; font:16px/1.45 Georgia, serif; color:var(--ink); background:var(--paper); }
  main { max-width:960px; margin:0 auto; padding:24px; }
  .mark { font:12px/1.3 ui-sans-serif, sans-serif; letter-spacing:.08em; text-transform:uppercase; }
  h1 { font-size:clamp(2rem, 5vw, 3.4rem); line-height:1.05; margin:.2em 0 .4em; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); }
  .card, .band, .step { border:1px solid var(--line); padding:16px; background:#fffdf8; }
  .band { display:grid; gap:12px; }
  .photo { min-height:220px; background:#c8b49a; display:flex; align-items:flex-end; padding:12px; }
  .scene { display:block; width:100%; height:auto; }
  .plate { margin:0; }
  .plate img { display:block; width:100%; height:auto; object-fit:cover; object-position:center 42%; }
  .split { grid-template-columns:1.4fr .8fr; }
  @media (max-width:420px) { .split { grid-template-columns:1fr; } }
  .pair-type { font-family: "Iowan Old Style", Palatino, serif; background:#f4f7f8; }
  .pair-type h1 { font-family: "Avenir Next", "Segoe UI", sans-serif; font-weight:650; letter-spacing:-0.03em; }
  .pair-services { background:#f7f4ef; }
  .pair-services h1 { font-family: "Segoe UI", sans-serif; }
  a.action { display:inline-block; background:var(--accent); color:white; text-decoration:none; padding:12px 16px; }
  ol { padding-left:1.2rem; }
  @media (max-width:420px) { main { padding:16px; } .scramble { display:flex; flex-direction:column; } .scramble .action { order:-1; } .pair-project .split { grid-template-columns:1fr !important; } }
</style>
</head>
<body>
<main class="pair-type" data-evidence-kind="original-synthetic" data-pair="type" data-role="strong">
  <p class="mark">Synthetic teaching example · strong · not a client site</p>
  <h1>One offer line</h1>
  <p>A single display line, a supporting sentence, and one action.</p>
  
  
  
  
  
  
  <p>Written scopes for historic roofs.</p><p><a class="action" href="#talk">Request the scope</a></p>
  
  
  
  
  
</main>
</body>
</html>
