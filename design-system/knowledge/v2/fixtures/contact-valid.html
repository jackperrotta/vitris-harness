<!doctype html>
<html lang="en">
<head>
<style>
  html { scroll-padding-top: 72px; }
  .bar { position: sticky; top: 0; }
</style>
</head>
<body>
<main>
  <h1>Request a slate estimate</h1>
  <form>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required aria-describedby="email-error">
    <p id="email-error" role="alert">Enter an email so the estimator can reply.</p>
    <button type="submit">Request the estimate</button>
  </form>
</main>
</body>
</html>
